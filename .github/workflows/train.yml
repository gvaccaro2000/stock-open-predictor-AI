# Weekly: retrain the after-open model on ~3 years of history and re-run the
# walk-forward backtest. Also has a "Run workflow" button.
name: Train model

on:
  schedule:
    - cron: "37 9 * * 6"     # Saturdays
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repo-writer
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "backend[dev]"
      - run: pytest backend
      - name: Train and backtest
        run: python -m predictor.train --universe us1500
      - name: Commit model
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/model.json docs/data/backtest.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Retrain model $(date -u +%F)"
          git pull --rebase origin main
          git push
