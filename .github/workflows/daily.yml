# Runs the prediction pipeline every US trading morning and publishes
# docs/data/today.json, which the iPhone app downloads via GitHub Pages.
name: Daily predictions

on:
  schedule:
    # GitHub cron is in UTC. 8:30 New York time is 13:30 UTC in winter (EST)
    # and 12:30 UTC in summer (EDT), so we run at both; the later run simply
    # overwrites the file with fresher premarket data.
    # Note: GitHub may start scheduled jobs a few minutes late.
    - cron: "30 12,13 * * 1-5"
  workflow_dispatch: {}   # adds a "Run workflow" button for manual runs

permissions:
  contents: write   # needed to commit the new JSON back to the repo

concurrency:
  group: daily-predictions
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e "backend[dev]"

      - name: Test
        run: pytest backend

      - name: Run pipeline
        run: python -m predictor.run --universe sp500 --top 25

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Predictions for $(date -u +%F)"
          git push
