# Runs the prediction pipeline every US trading morning and publishes
# docs/data/today.json, which the iPhone app downloads via GitHub Pages.
name: Daily predictions

on:
  schedule:
    # GitHub cron is in UTC. The US open (9:30 New York) is 14:30 UTC in winter
    # (EST) and 13:30 UTC in summer (EDT). GitHub often delays scheduled jobs and
    # can skip them when busy, especially at :00 and :30, so we schedule several
    # runs at quieter minutes. Each run overwrites today.json with fresher
    # pre-market data; any of them succeeding is enough.
    - cron: "17 12 * * 1-5"   # 07:17 NY winter / 08:17 NY summer
    - cron: "47 12 * * 1-5"   # 07:47 / 08:47
    - cron: "13 13 * * 1-5"   # 08:13 / 09:13
    - cron: "41 13 * * 1-5"   # 08:41 winter (summer: after the open, still useful as a check)
  workflow_dispatch: {}   # adds a "Run workflow" button for manual runs

permissions:
  contents: write   # needed to commit the new JSON back to the repo

concurrency:
  group: daily-predictions
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e "backend[dev]"

      - name: Test
        run: pytest backend

      - name: Run pipeline
        env:
          # Add these under Settings → Secrets and variables → Actions.
          # Without ANTHROPIC_API_KEY the run still works, using price signals only.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}   # optional, extra news coverage
        run: python -m predictor.run --universe us1500 --top 25 --news-candidates 80

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Predictions for $(date -u +%F)"
          git push
