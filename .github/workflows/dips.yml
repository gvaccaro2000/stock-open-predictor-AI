# Buy-the-dip ideas. Normally built every evening inside the "Track record" workflow;
# this one is for running it on demand (Run workflow button or the trigger file).
name: Buy-the-dip ideas

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [".github/triggers/dips"]

permissions:
  contents: write

concurrency:
  group: repo-writer
  cancel-in-progress: false

jobs:
  dips:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "backend[dev]"
      - name: Build buy-the-dip ideas
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python -m predictor.dips --universe us1500
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Buy-the-dip ideas $(date -u +%F)"
          git pull --rebase origin main
          git push
