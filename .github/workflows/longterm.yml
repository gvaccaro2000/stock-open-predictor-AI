# Weekly: long-term ideas from fundamentals, multiples vs sector, analyst consensus,
# sector trends and news, with a written analysis by Claude for each pick.
name: Long-term ideas

on:
  schedule:
    - cron: "23 10 * * 0"    # Sundays
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [".github/triggers/longterm"]

permissions:
  contents: write

concurrency:
  group: repo-writer
  cancel-in-progress: false

jobs:
  longterm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "backend[dev]"
      - name: Build long-term ideas
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python -m predictor.longterm --universe us1500
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Long-term ideas $(date -u +%F)"
          git pull --rebase origin main
          git push
